<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VetCloud — Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="./shared/api.js"></script>
<link rel="stylesheet" href="./shared/panel.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">V</div>
      <div><div class="brand-name">VetCloud</div><div class="brand-sub" id="clinicName">Cargando…</div></div>
    </div>
    <nav>
      <div class="nav-group">
        <a class="nav-item" href="./dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Dashboard
        </a>
        <a class="nav-item active" href="./clientes.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 21c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></svg>
          Clientes
        </a>
        <a class="nav-item" href="./mascotas.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-4.5-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 6C19 16.5 12 21 12 21Z"/></svg>
          Mascotas
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-label">Sistema</div>
        <a class="nav-item" href="./usuarios.html" data-roles="admin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M4 12h2m12 0h2M12 4v2m0 12v2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/></svg>
          Usuarios y roles
        </a>
      </div>
    </nav>
    <div class="sidebar-foot">Ambiente SRI: pruebas<br>Plan Pro · v1.0</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div class="greeting"><div class="greeting-eyebrow">Clientes</div><h1>Dueños registrados</h1></div>
      </div>
      <div class="topbar-right">
        <div class="user-chip">
          <div class="avatar" id="userAvatar">--</div>
          <div><div class="name" id="userName">—</div><div class="role" id="userRole">—</div></div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Cerrar sesión">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>Clientes</h2>
          <div class="sub" id="totalClientes">Cargando…</div>
        </div>
        <div style="display:flex;gap:10px;">
          <input type="search" id="buscador" placeholder="Buscar por nombre, cédula o teléfono…" class="search-input">
          <button class="btn-primary" onclick="abrirModal()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Nuevo cliente
          </button>
        </div>
      </div>

      <table>
        <thead>
          <tr><th>Cliente</th><th>Identificación</th><th>Contacto</th><th>Mascotas</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody id="tablaClientes">
          <tr><td colspan="6" class="empty-state">Cargando clientes…</td></tr>
        </tbody>
      </table>

      <div class="pager" id="pager"></div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitulo">Nuevo cliente</h2>
    <div class="sub">Datos del dueño de la mascota.</div>
    <div class="error-box" id="modalError"></div>

    <form id="formCliente">
      <input type="hidden" id="f_id">
      <div class="field-row">
        <div class="field"><label>Nombres</label><input type="text" id="f_nombres" required></div>
        <div class="field"><label>Apellidos</label><input type="text" id="f_apellidos"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Tipo de identificación</label>
          <select id="f_tipo_identificacion">
            <option value="cedula">Cédula</option>
            <option value="ruc">RUC</option>
            <option value="pasaporte">Pasaporte</option>
          </select>
        </div>
        <div class="field"><label>Número</label><input type="text" id="f_numero_identificacion" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Teléfono</label><input type="text" id="f_telefono" required></div>
        <div class="field"><label>Correo (opcional)</label><input type="email" id="f_email"></div>
      </div>
      <div class="field"><label>Dirección</label><input type="text" id="f_direccion"></div>
      <div class="field-row">
        <div class="field"><label>Ciudad</label><input type="text" id="f_ciudad"></div>
        <div class="field"><label>Provincia</label><input type="text" id="f_provincia"></div>
      </div>
      <div class="field"><label>Notas</label><input type="text" id="f_notas" placeholder="Referencias, preferencias, etc."></div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn-primary" id="btnGuardar">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
  const usuario = requireAuth();
  document.getElementById('userAvatar').textContent = iniciales(usuario.nombres, usuario.apellidos);
  document.getElementById('userName').textContent = `${usuario.nombres} ${usuario.apellidos}`;
  document.getElementById('userRole').textContent = ETIQUETAS_ROL[usuario.rol] || usuario.rol;
  applyRoleNav(usuario.rol);
  apiFetch('/auth/me').then(me => { document.getElementById('clinicName').textContent = me.nombre_comercial; }).catch(()=>{});

  let paginaActual = 1;
  let terminoBusqueda = '';

  async function cargarClientes(page = 1) {
    paginaActual = page;
    const tbody = document.getElementById('tablaClientes');
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Cargando clientes…</td></tr>';
    try {
      const qs = new URLSearchParams({ page, per_page: 10 });
      if (terminoBusqueda) qs.set('search', terminoBusqueda);
      const { data, pagination } = await apiFetch(`/clientes?${qs.toString()}`);

      document.getElementById('totalClientes').textContent = `${pagination.total} cliente${pagination.total === 1 ? '' : 's'} registrado${pagination.total === 1 ? '' : 's'}`;

      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No se encontraron clientes.</td></tr>';
        document.getElementById('pager').innerHTML = '';
        return;
      }

      tbody.innerHTML = data.map(c => `
        <tr>
          <td>
            <div class="cell-user">
              <div class="avatar">${iniciales(c.nombres, c.apellidos || '')}</div>
              <div><div class="name">${c.nombres} ${c.apellidos || ''}</div><div class="email">${c.email || 'Sin correo'}</div></div>
            </div>
          </td>
          <td class="mono" style="font-size:12.5px;">${c.numero_identificacion}</td>
          <td>${c.telefono}</td>
          <td><a href="./mascotas.html?cliente_id=${c.id}" class="link-chip">Ver mascotas</a></td>
          <td><span class="estado-dot estado-${c.estado}">${c.estado.charAt(0).toUpperCase() + c.estado.slice(1)}</span></td>
          <td>
            <div class="row-actions">
              <button class="icon-btn" title="Editar" onclick='editarCliente(${JSON.stringify(c)})'>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
            </div>
          </td>
        </tr>`).join('');

      renderPager(pagination);
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`;
    }
  }

  function renderPager(p) {
    const el = document.getElementById('pager');
    if (p.total_pages <= 1) { el.innerHTML = ''; return; }
    el.innerHTML = `
      <button class="btn-ghost" ${p.page <= 1 ? 'disabled' : ''} onclick="cargarClientes(${p.page - 1})">← Anterior</button>
      <span class="pager-info">Página ${p.page} de ${p.total_pages}</span>
      <button class="btn-ghost" ${p.page >= p.total_pages ? 'disabled' : ''} onclick="cargarClientes(${p.page + 1})">Siguiente →</button>`;
  }

  let buscarTimeout;
  document.getElementById('buscador').addEventListener('input', (e) => {
    clearTimeout(buscarTimeout);
    buscarTimeout = setTimeout(() => { terminoBusqueda = e.target.value.trim(); cargarClientes(1); }, 350);
  });

  function abrirModal() {
    document.getElementById('formCliente').reset();
    document.getElementById('f_id').value = '';
    document.getElementById('modalTitulo').textContent = 'Nuevo cliente';
    document.getElementById('modalError').classList.remove('show');
    document.getElementById('overlay').classList.add('open');
  }
  function editarCliente(c) {
    document.getElementById('f_id').value = c.id;
    document.getElementById('f_nombres').value = c.nombres || '';
    document.getElementById('f_apellidos').value = c.apellidos || '';
    document.getElementById('f_tipo_identificacion').value = c.tipo_identificacion || 'cedula';
    document.getElementById('f_numero_identificacion').value = c.numero_identificacion || '';
    document.getElementById('f_telefono').value = c.telefono || '';
    document.getElementById('f_email').value = c.email || '';
    document.getElementById('f_direccion').value = c.direccion || '';
    document.getElementById('f_ciudad').value = c.ciudad || '';
    document.getElementById('f_provincia').value = c.provincia || '';
    document.getElementById('f_notas').value = c.notas || '';
    document.getElementById('modalTitulo').textContent = 'Editar cliente';
    document.getElementById('modalError').classList.remove('show');
    document.getElementById('overlay').classList.add('open');
  }
  function cerrarModal() { document.getElementById('overlay').classList.remove('open'); }
  document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') cerrarModal(); });

  document.getElementById('formCliente').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('modalError');
    const btn = document.getElementById('btnGuardar');
    errorBox.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Guardando…';

    const payload = {
      nombres: document.getElementById('f_nombres').value.trim(),
      apellidos: document.getElementById('f_apellidos').value.trim() || null,
      tipo_identificacion: document.getElementById('f_tipo_identificacion').value,
      numero_identificacion: document.getElementById('f_numero_identificacion').value.trim(),
      telefono: document.getElementById('f_telefono').value.trim(),
      email: document.getElementById('f_email').value.trim() || null,
      direccion: document.getElementById('f_direccion').value.trim() || null,
      ciudad: document.getElementById('f_ciudad').value.trim() || null,
      provincia: document.getElementById('f_provincia').value.trim() || null,
      notas: document.getElementById('f_notas').value.trim() || null,
    };

    const id = document.getElementById('f_id').value;
    try {
      if (id) {
        await apiFetch(`/clientes/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
      } else {
        await apiFetch('/clientes', { method: 'POST', body: JSON.stringify(payload) });
      }
      cerrarModal();
      cargarClientes(paginaActual);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    } finally {
      btn.disabled = false; btn.textContent = 'Guardar';
    }
  });

  cargarClientes();
</script>
</body>
</html>
